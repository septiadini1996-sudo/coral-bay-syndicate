<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coral Bay Syndicate</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1210; font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; }
  canvas#game { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  #mapwrap { position: absolute; left: 18px; bottom: 18px; width: 176px; height: 176px; border-radius: 50%; overflow: hidden; border: 3px solid rgba(10, 24, 32, 0.85); box-shadow: 0 4px 24px rgba(0,0,0,0.45); background: #2b6f8e; }
  #map { width: 176px; height: 176px; }
  #topbar { position: absolute; top: 16px; right: 20px; text-align: right; }
  #stars { font-size: 26px; letter-spacing: 3px; min-height: 30px; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
  #cash { font-size: 30px; font-weight: 800; color: #7be495; text-shadow: 0 2px 8px rgba(0,0,0,0.65); }
  #objective { position: absolute; top: 16px; left: 20px; max-width: 44vw; color: #ffe9b0; font-size: 17px; font-weight: 700; letter-spacing: 0.4px; text-shadow: 0 2px 6px rgba(0,0,0,0.7); transition: opacity 0.3s; }
  #prompt { position: absolute; left: 50%; bottom: 12vh; transform: translateX(-50%); color: #fff; background: rgba(8, 20, 28, 0.72); padding: 8px 18px; border-radius: 999px; font-size: 16px; font-weight: 600; letter-spacing: 0.3px; transition: opacity 0.15s; opacity: 0; white-space: nowrap; }
  #cross { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.9); font-size: 22px; font-weight: 300; text-shadow: 0 0 6px rgba(0,0,0,0.8); opacity: 0; transition: opacity 0.2s; }
  #bustWrap { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); width: 240px; height: 10px; border-radius: 5px; background: rgba(0,0,0,0.55); opacity: 0; transition: opacity 0.2s; overflow: hidden; }
  #bustFill { height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #ef4444); }
  #dialog { position: absolute; left: 50%; bottom: 5vh; transform: translateX(-50%); width: min(680px, 88vw); background: rgba(8, 18, 26, 0.88); border-left: 4px solid #ffc93c; border-radius: 8px; padding: 14px 20px; display: none; }
  #dlgWho { color: #ffc93c; font-weight: 800; font-size: 14px; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 5px; }
  #dlgText { color: #f4f1de; font-size: 17px; line-height: 1.45; }
  #toast { position: absolute; left: 50%; top: 12vh; transform: translateX(-50%); color: #10222e; background: linear-gradient(180deg, #ffe9a8, #ffc93c); font-weight: 800; font-size: 17px; padding: 9px 22px; border-radius: 999px; opacity: 0; transition: opacity 0.35s; box-shadow: 0 6px 24px rgba(0,0,0,0.4); white-space: nowrap; }
  #vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 52%, rgba(190, 18, 40, 0.5) 100%); opacity: 0; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(180deg, rgba(24, 10, 8, 0.55), rgba(10, 16, 28, 0.82)); backdrop-filter: blur(2px); z-index: 5; }
  .title { font-size: clamp(42px, 8vw, 84px); font-weight: 900; letter-spacing: 2px; line-height: 0.95; background: linear-gradient(180deg, #ffe9a8 15%, #ff9a5a 55%, #ef476f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 4px 18px rgba(239, 71, 111, 0.35)); }
  .subtitle { color: #f4f1de; font-size: clamp(14px, 2vw, 19px); letter-spacing: 4px; text-transform: uppercase; margin: 10px 0 30px; opacity: 0.92; }
  .btn { pointer-events: auto; cursor: pointer; border: 0; border-radius: 999px; padding: 13px 42px; margin: 6px; font-size: 18px; font-weight: 800; letter-spacing: 1px; color: #231303; background: linear-gradient(180deg, #ffe9a8, #ffb03a); box-shadow: 0 6px 20px rgba(0,0,0,0.45); }
  .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn.ghost { background: rgba(244, 241, 222, 0.14); color: #f4f1de; border: 1px solid rgba(244,241,222,0.5); }
  .controls { margin-top: 28px; color: rgba(244, 241, 222, 0.85); font-size: 14px; line-height: 1.9; letter-spacing: 0.4px; }
  .controls b { color: #ffc93c; font-weight: 800; }
  .big { font-size: clamp(40px, 7vw, 68px); font-weight: 900; letter-spacing: 6px; color: #f4f1de; }
  .fine { color: rgba(244,241,222,0.9); font-size: 16px; margin: 12px 0 24px; max-width: 520px; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="objective"></div>
  <div id="topbar"><div id="stars"></div><div id="cash">$0</div></div>
  <div id="mapwrap"><canvas id="map" width="176" height="176"></canvas></div>
  <div id="prompt"></div>
  <div id="cross">+</div>
  <div id="bustWrap"><div id="bustFill"></div></div>
  <div id="dialog"><div id="dlgWho"></div><div id="dlgText"></div></div>
  <div id="toast"></div>
</div>
<div id="vig"></div>

<div id="menu" class="screen">
  <div class="title">CORAL BAY<br>SYNDICATE</div>
  <div class="subtitle">One bay. One wheelman. No questions.</div>
  <button class="btn" id="continueBtn" style="display:none">CONTINUE</button>
  <button class="btn" id="startBtn">NEW GAME</button>
  <div class="controls">
    <b>WASD</b> move / drive &nbsp;·&nbsp; <b>Mouse</b> camera (click to lock) &nbsp;·&nbsp; <b>Shift</b> sprint<br>
    <b>E</b> talk / steal / enter &nbsp;·&nbsp; <b>F</b> punch — or fire when armed &nbsp;·&nbsp; <b>Space</b> hop / handbrake &nbsp;·&nbsp; <b>Esc</b> pause
  </div>
</div>

<div id="pauseScr" class="screen">
  <div class="big">PAUSED</div>
  <div class="fine">The bay waits for no one — but it will wait for you.</div>
  <button class="btn" id="resumeBtn">RESUME</button>
  <button class="btn ghost" id="saveBtn">SAVE GAME</button>
</div>

<div id="bustedScr" class="screen">
  <div class="big" style="color:#ff5147">BUSTED</div>
  <div class="fine" id="bustedFine"></div>
  <button class="btn" id="bustedBtn">WALK FREE</button>
</div>

<script src="vendor/three.min.js"></script>
<script type="module" src="src/boot.js"></script>
</body>
</html>
